# =============================================================================
# External Emerging Collectibles Intelligence Agent — configuration
# =============================================================================
# Everything is configurable here. The system runs fully in deterministic,
# no-LLM, external-only mode with the defaults below. eBay is excluded by
# default. New verticals / sports / sources / taxonomies can be added here
# WITHOUT touching code.
# =============================================================================

run_reference: 9839
external_only_mode: true
timezone: "Asia/Kolkata"          # IST reference; UTC always also recorded

# ---------------------------------------------------------------------------
# Network / outbound proxy. On Krylov, set apply_proxy_env: true so the crawler
# routes outbound HTTPS through eBay's proxy (lets Krylov "hit the net").
# Leave false elsewhere (the crawler then uses the machine's normal network /
# any HTTP(S)_PROXY already in the environment).
# ---------------------------------------------------------------------------
network:
  apply_proxy_env: false
  http_proxy: "http://httpproxy-tcop.vip.ebay.com:80"
  https_proxy: "http://httpproxy-tcop.vip.ebay.com:80"
  no_proxy: "localhost,127.0.0.1,::1"

# ---------------------------------------------------------------------------
# Runtime / worker
# ---------------------------------------------------------------------------
runtime:
  mode: "continuous"              # one-shot | continuous | scheduled
  auto_start_worker: true
  crawl_interval_seconds: 900     # sleep between cycles in continuous mode
  dashboard_auto_refresh_seconds: 30
  worker_heartbeat_seconds: 15
  stale_worker_threshold_seconds: 120
  max_cycles: 0                   # 0 = unlimited (continuous)

# ---------------------------------------------------------------------------
# Verticals (fully configurable)
# ---------------------------------------------------------------------------
verticals:
  - "Trading Cards"
  - "Coins"
  - "Collectibles"
  - "Comic Books and Memorabilia"
  - "Toys and Hobbies"
  - "Vinyl Records"
  - "Watches"
  - "Sports Memorabilia"
  - "Entertainment Memorabilia"
  - "Autographs"

vertical_coverage:
  require_all_verticals_each_cycle: true
  min_urls_per_vertical: 100

# ---------------------------------------------------------------------------
# Taxonomy: categories / subcategories / sports / franchises
# ---------------------------------------------------------------------------
taxonomy:
  categories:
    "Trading Cards":
      - "Baseball cards"
      - "Basketball cards"
      - "Football cards"
      - "Soccer cards"
      - "Hockey cards"
      - "Formula 1 cards"
      - "UFC cards"
      - "WWE cards"
      - "Pokemon cards"
      - "Magic: The Gathering"
      - "Yu-Gi-Oh!"
      - "One Piece TCG"
      - "Lorcana"
      - "Marvel cards"
      - "Star Wars cards"
      - "Entertainment cards"
      - "Graded cards"
      - "Sealed boxes"
    "Coins": ["Rare coins", "Commemorative coins", "Bullion", "Ancient coins", "Error coins", "Graded coins"]
    "Collectibles": ["General collectibles", "Pop culture", "Limited editions"]
    "Comic Books and Memorabilia": ["Key issues", "Graded comics", "Modern comics", "Golden age", "Silver age", "Movie memorabilia"]
    "Toys and Hobbies": ["Action figures", "LEGO", "Funko Pop", "Model kits", "Die-cast", "Plush"]
    "Vinyl Records": ["Reissues", "Limited pressings", "Record Store Day", "Original pressings", "Colored vinyl"]
    "Watches": ["Luxury watches", "Vintage watches", "Limited edition watches", "Discontinued references"]
    "Sports Memorabilia": ["Signed jerseys", "Game-used", "Championship items", "Rookie collectibles"]
    "Entertainment Memorabilia": ["Props", "Posters", "Autographed items", "Convention exclusives"]
    "Autographs": ["Sports autographs", "Entertainment autographs", "Historical autographs"]

  subcategories:
    product_types:
      - "Hobby box"
      - "Blaster box"
      - "Retail box"
      - "Booster box"
      - "Pack"
      - "Case"
      - "Sealed product"
      - "Single card"
      - "Autograph card"
      - "Rookie card"
      - "Parallel card"
      - "Short print"
      - "Serial-numbered card"
      - "Limited release"
      - "Graded slab"

  sports:
    - "Baseball"
    - "Basketball"
    - "Football"
    - "Soccer"
    - "Hockey"
    - "Formula 1"
    - "UFC"
    - "WWE"
    - "Cricket"
    - "Tennis"
    - "Golf"
    - "Olympics"

  franchises:
    - "Pokemon"
    - "Magic: The Gathering"
    - "Yu-Gi-Oh!"
    - "One Piece"
    - "Lorcana"
    - "Marvel"
    - "DC"
    - "Star Wars"
    - "Disney"
    - "Harry Potter"
    - "Star Trek"

# ---------------------------------------------------------------------------
# Source domain exclusion / inclusion
# ---------------------------------------------------------------------------

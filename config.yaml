# ---------------------------------------------------------------------------
# URL discovery budgets (high recall)
# ---------------------------------------------------------------------------
url_discovery:
  min_urls_per_cycle: 500
  target_urls_per_cycle: 2000
  max_urls_per_cycle: 10000
  min_urls_per_vertical: 100
  max_urls_per_domain_per_cycle: 100
  max_discovery_seconds: 120        # hard cap so a slow/blocked network never hangs a cycle
  max_recursion_depth: 3
  enable_recursive_expansion: true
  enable_search_api_discovery: true
  enable_gdelt_discovery: true
  enable_rss_discovery: true
  enable_sitemap_discovery: true
  enable_wikipedia_discovery: true
  enable_wikidata_discovery: true
  enable_news_discovery: true
  enable_retail_discovery: true
  enable_marketing_page_discovery: true
  enable_release_calendar_discovery: true
  enable_event_calendar_discovery: true
  enable_reddit_discovery: true    # keyless collector-community RSS (agent-reach style)
  enable_hn_discovery: true        # keyless Hacker News Algolia search
  enable_youtube_discovery: true   # OFFICIAL YouTube channel RSS only (no scraping)
  relevance_threshold: 0.15        # low threshold = high recall

# ---------------------------------------------------------------------------
# Search providers (compliant APIs only; no direct SERP scraping)
# ---------------------------------------------------------------------------
search_providers:
  google_custom_search:
    # NOTE: Google closed the Custom Search JSON API to NEW customers. A newly
    # created GCP project returns 403 "project does not have access" no matter
    # what — so this only works with an OLD project that was already a customer.
    # Off by default for that reason. cx stays baked in case you have such a key.
    enabled: false
    api_key_env: "GOOGLE_CUSTOM_SEARCH_API_KEY"
    cx_env: "GOOGLE_CUSTOM_SEARCH_CX"
    cx: "d1226d0d467ff4133"            # Foresight CSE id (not secret); env var overrides if set
    max_queries_per_cycle: 15          # free tier = 100/day; keep well under it
  bing:
    enabled: false
    api_key_env: "BING_SEARCH_API_KEY"
    endpoint: "https://api.bing.microsoft.com/v7.0/search"
    max_queries_per_cycle: 20
  serpapi:
    enabled: false
    api_key_env: "SERPAPI_API_KEY"
  gdelt:
    enabled: true                  # free, no key
  rss:
    enabled: true
  wikipedia:
    enabled: true                  # free, no key
  wikidata:
    enabled: true                  # free, no key
  reddit:
    enabled: true                  # public RSS discovery (keyless) — auto-skipped if reddit_api on
  reddit_api:
    enabled: false                 # official Reddit Data API (set true + add creds to .env)
    client_id_env: "REDDIT_CLIENT_ID"
    client_secret_env: "REDDIT_CLIENT_SECRET"
    user_agent: "python:foresight-collectibles:1.0 (research)"
    limit_per_subreddit: 25
    max_subreddits_per_cycle: 22
  hackernews:
    enabled: true                  # Algolia public API (keyless)

# ---------------------------------------------------------------------------
# Scraping / rendering
# ---------------------------------------------------------------------------
scraping:
  max_pages_per_cycle: 120
  max_pages_per_domain: 20
  max_crawl_depth: 3
  request_timeout_seconds: 20
  per_domain_delay_seconds: 2.0
  global_max_concurrency: 6
  respect_robots_txt: true
  user_agent: "EmergingCollectiblesIntelligenceBot/1.0 (+research; respects robots.txt)"
  min_product_name_quality: 0.5     # reject non-product strings (news/prose/spec lines)
  use_playwright: false
  use_camoufox: false
  use_jina_reader: false            # optional public URL→markdown reader (agent-reach style);
  jina_api_key_env: "JINA_API_KEY"  # needs a (free-tier) key; used as a compliant fetch fallback
  max_bytes_per_page: 3000000
  retry_on_network_error: 2

# ---------------------------------------------------------------------------
# LLM (optional enhancement; deterministic fallback always available)
# ---------------------------------------------------------------------------
llm:
  use_llm: false
  provider: "openai"
  model_env: "LLM_MODEL"
  api_key_env: "LLM_API_KEY"
  base_url_env: "LLM_BASE_URL"
  max_retries: 1
  timeout_seconds: 30
  temperature: 0.1

# ---------------------------------------------------------------------------
# Event / seasonality intelligence
# ---------------------------------------------------------------------------
event_intelligence:
  enabled: true
  upcoming_event_window_days: 180
  recent_event_window_days: 30
  seasonality_enabled: true
  event_to_product_mapping_enabled: true
  require_event_source_evidence: true
  no_hallucinated_dates: true
  event_half_life_days:
    sports_news: 14
    product_release: 30
    entertainment: 45
    auction_market: 21
    long_cycle: 90                 # watches / coins / vinyl

# ---------------------------------------------------------------------------
# Scoring: EPS weights (must sum to 1.0)
# ---------------------------------------------------------------------------
eps_weights:
  freshness: 0.17
  source_credibility: 0.13
  mention_velocity: 0.14
  source_diversity: 0.12
  news_catalyst: 0.12
  event_proximity: 0.10
  marketplace_signal: 0.08
  scarcity_signal: 0.06
  release_signal: 0.05
  ai_confidence: 0.03

# VTM weights (must sum to 1.0)
vtm_weights:
  credible_source_coverage: 0.22
  independent_confirmation: 0.18
  mention_acceleration: 0.14
  evidence_quality: 0.14
  event_validation: 0.12
  cross_category_catalyst: 0.08
  recency_consistency: 0.07
  noise_penalty_adjusted: 0.05

scoring_params:
  freshness_half_life_hours:
    news_sensitive: 48
    trading_cards: 72
    long_cycle: 168                # watches / coins / vinyl / comics
  recent_window_hours: 48
  baseline_window_hours: 168
  smoothing_factor: 1.0
  target_source_type_count: 4
  required_credible_sources: 3

# Source credibility baselines by source type (0..1)
source_credibility_baselines:
  "official manufacturer": 0.95
  "official league/team/personality/franchise source": 0.9
  "auction house": 0.9
  "grading company": 0.9
  "public marketplace": 0.82
  "hobby publication": 0.82
  "price guide": 0.85
  "sports news": 0.8
  "entertainment news": 0.78
  "general news": 0.8
  "release calendar": 0.8
  "collector forum": 0.65
  "social/news aggregation": 0.7
  "SEO article": 0.3
  "unknown": 0.4

# ---------------------------------------------------------------------------
# Trend status thresholds
# ---------------------------------------------------------------------------
validation_thresholds:
  strong_emerging: { eps: 75, vtm: 65 }
  emerging_needs_validation: { eps: 70, vtm_below: 65 }
  validated_momentum: { eps: 60, vtm: 75 }
  watchlist_eps: [40, 69]
  watchlist_vtm: [40, 64]
  low_confidence: { eps_below: 40, vtm_below: 40 }
  false_positive: { eps: 70, vtm_below: 35 }

# ---------------------------------------------------------------------------
# Self-serve recovery / adaptive strategy / tool discovery
# ---------------------------------------------------------------------------
self_serve_recovery:
  enabled: true
  max_recovery_per_cycle: 6              # cap expensive recovery work per cycle
  max_recovery_attempts_per_url: 5
  max_new_tools_per_day: 3
  auto_install_tools: false
  tool_install_mode: "recommend_only"   # recommend_only | sandbox_auto_install | approved_auto_install
  require_allowlist_for_install: true
  allow_github_install: false
  allow_pypi_install: true
  sandbox_test_required: true
  promote_only_if_tests_pass: true
  rollback_on_failure: true
  alternative_source_search_enabled: true
  tool_allowlist: ["trafilatura", "readability-lxml", "extruct", "newspaper3k", "goose3"]

adaptive_strategy_router:
  enabled: true
  use_domain_memory: true
  use_strategy_registry: true
  min_success_rate_for_priority: 0.60
  max_failure_rate_before_alternative_source: 0.70

tool_discovery:
  enabled: true
  search_github: true
  search_pypi: true
  min_candidate_score: 0.75
  require_recent_commit_months: 12
  require_license: true
  disallow_unknown_license: true
  disallow_unmaintained_tools: true

# ---------------------------------------------------------------------------
# Decay / self-learning parameters
# ---------------------------------------------------------------------------
learning:
  failure_penalty: 0.35
  fatigue_threshold: 8.0
  recovery_boost_step: 0.1
  source_quality_alpha: 0.3        # EWMA smoothing for rolling quality
  min_domain_quality: 0.1

# ---------------------------------------------------------------------------
# Geography (global by default)
# ---------------------------------------------------------------------------
geography:
  mode: "global"                   # global | country | region
  country: null
  region: null
  source_languages: ["en"]         # empty = all languages
  default_market_scope: "global"

# ---------------------------------------------------------------------------
# Persistence / outputs
# ---------------------------------------------------------------------------
database_path: "data/collectibles.db"
output_dir: "outputs"

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------
dashboard:
  framework: "streamlit"
  auto_refresh: true
  refresh_seconds: 30
  show_url_sourcing_agent: true
  show_url_funnel: true
  show_source_mix: true
  show_event_seasonality: true
  show_worker_status: true
  show_cse_widget: true               # embed the Google Programmable Search box in the dashboard
  cse_cx: "d1226d0d467ff4133"         # Foresight CSE id used by the embedded widget
  colors:
    red: "#E53238"
    blue: "#0064D2"
    yellow: "#F5AF02"
    green: "#86B817"
    dark_text: "#111827"
    light_bg: "#F9FAFB"

# ---------------------------------------------------------------------------
# Optional Hive sink (eBay / Krylov) — mirror the master CSV into Hive.
# Disabled by default; only runs where PyHive + Kerberos are available.
# ---------------------------------------------------------------------------
hive_sink:
  enabled: false                       # set true on Krylov
  host: "hermes.prod.vip.ebay.com"
  port: 10000
  auth: "KERBEROS"
  kerberos_service_name: "b_carmel"
  username_env: "KRYLOV_PRINCIPAL"     # Kerberos principal from env (no secrets in code)
  database: "P_UKPLAN_BACKUPS_T"
  table: "foresight1"
  write_mode: "append"                 # append = keep dated history in Hermes; replace = mirror latest
  batch_size: 50
  clear_csv_after_write: true          # empty master CSV once rows are safely in Hive

# ---------------------------------------------------------------------------
# Optional Cloud Code / Kryo governance adapter (disabled by default)
# ---------------------------------------------------------------------------
cloud_code:
  use_cloud_code_api: false
  api_key_env: "CLOUD_CODE_API_KEY"
  base_url_env: "CLOUD_CODE_BASE_URL"
  send_internal_data: false        # governance: never send internal data unless true
